<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #172b4d;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 600px; margin: 0 auto; }

    h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }

    /* Add form */
    .add-form {
      background: #fff;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    .add-form input[type="text"] {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .add-form select {
      padding: 0.5rem 0.5rem;
      border: 1px solid #dfe1e6;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-primary { background: #0052cc; color: #fff; }
    .btn-primary:hover { background: #0065ff; }
    .btn-done { background: #00875a; color: #fff; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
    .btn-done:hover { background: #006644; }
    .btn-delete { background: #de350b; color: #fff; font-size: 0.8rem; padding: 0.3rem 0.6rem; }
    .btn-delete:hover { background: #bf2600; }

    /* Task list */
    .task-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .task-card {
      background: #fff;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      transition: opacity 0.2s;
    }

    .task-card.done { opacity: 0.5; }

    .task-card.done .task-title { text-decoration: line-through; }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .badge-high   { background: #ffebe6; color: #bf2600; }
    .badge-medium { background: #fffae6; color: #974f0c; }
    .badge-low    { background: #e3fcef; color: #006644; }

    .task-title { flex: 1; font-size: 0.95rem; }

    .task-actions { display: flex; gap: 0.4rem; }

    .empty {
      text-align: center;
      color: #6b778c;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>

    <form class="add-form" action="/add" method="POST">
      <input type="text" name="title" placeholder="What needs to be done?" required autofocus />
      <select name="priority">
        {% for p in priorities %}
          <option value="{{ p }}" {% if p == "medium" %}selected{% endif %}>{{ p.capitalize() }}</option>
        {% endfor %}
      </select>
      <button class="btn btn-primary" type="submit">Add</button>
    </form>

    <div class="task-list">
      {% if tasks %}
        {% for task in tasks %}
          <div class="task-card {{ 'done' if task.done }}">
            <span class="badge badge-{{ task.get('priority', 'medium') }}">
              {{ task.get('priority', 'medium') }}
            </span>
            <span class="task-title">{{ task.title }}</span>
            <div class="task-actions">
              {% if not task.done %}
                <form action="/complete/{{ task.id }}" method="POST">
                  <button class="btn btn-done" type="submit">Done</button>
                </form>
              {% endif %}
              <form action="/delete/{{ task.id }}" method="POST">
                <button class="btn btn-delete" type="submit">Delete</button>
              </form>
            </div>
          </div>
        {% endfor %}
      {% else %}
        <div class="empty">No tasks yet — add one above.</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
